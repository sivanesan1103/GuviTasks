<!DOCTYPE html>
<html>
<head>
    <title>Form with Default Values</title>
</head>
<body>

<form>

    <label>Full Name:</label>
    <input type="text" value="Siva Kumar">
    <br><br>

    <label>Email:</label>
    <input type="email" value="siva@example.com">
    <br><br>

    <label>Password:</label>
    <input type="password" value="12345">
    <br><br>

    <label>Age:</label>
    <input type="number" value="22">
    <br><br>

    <label>Date of Birth:</label>
    <input type="date" value="2002-01-01">
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="male" checked> Male
    <input type="radio" name="gender" value="female"> Female
    <br><br>

    <label>Skills:</label>
    <input type="checkbox" value="java" checked> Java
    <input type="checkbox" value="python"> Python
    <br><br>

    <label>Country:</label>
    <select>
        <option>India</option>
        <option selected>USA</option>
        <option>UK</option>
    </select>
    <br><br>

    <label>Message:</label>
    <textarea>Default message here...</textarea>
    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
