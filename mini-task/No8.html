<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Table</title>

<style>
    body {
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    table {
        border-collapse: collapse;
        background: #eaeaea;
        box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    th, td {
        border: 2px solid #666;
        padding: 10px 15px;
        text-align: center;
    }

    th {
        background: #dcdcdc;
        font-weight: bold;
    }
</style>
</head>

<body>

<table>

    <tr>
        <th rowspan="2">Customer</th>
        <th colspan="3">Items</th>
        <th colspan="2">Payments</th>
    </tr>

    <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Date</th>
        <th>Amount</th>
    </tr>

    <tr>
        <td rowspan="3">Customer Name</td>
        <td>Item1</td>
        <td>5</td>
        <td>$400.00</td>
        <td>12 Sep 2018</td>
        <td>$3,000.00</td>
    </tr>

    <tr>
        <td>Item2</td>
        <td>10</td>
        <td>$200.00</td>
        <td></td>
        <td></td>
    </tr>

    <tr>
        <td>Item3</td>
        <td>2</td>
        <td>$500.00</td>
        <td>18 Sep 2018</td>
        <td>$2,000.00</td>
    </tr>

</table>

</body>
</html>
